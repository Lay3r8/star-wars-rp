services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: starwars
      POSTGRES_PASSWORD: starwars
      POSTGRES_DB: star_wars_rp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starwars -d star_wars_rp"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://starwars:starwars@db:5432/star_wars_rp
      AUTH_SECRET: "${AUTH_SECRET:-slice-1-local-secret-change-before-external-use}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-false}"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn star_wars_rp.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ../apps/api/src:/app/src
      - ../apps/api/migrations:/app/migrations
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: ../apps/web
    environment:
      VITE_DEV_API_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ../apps/web:/app
      - web-node-modules:/app/node_modules
    depends_on:
      - api

volumes:
  postgres-data:
  web-node-modules:
